; Packaging (M6 smoke): keep L_Graybox in the cook list so a bare package boots.
; Pak + IoStore are engine defaults; explicit MapsToCook avoids "empty install" landmines.
[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
BlueprintNativizationMethod=Disabled
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
bUseIoStore=True
UsePakFile=True
bGenerateChunks=False
+MapsToCook=(FilePath="/Game/Maps/L_Graybox")
+MapsToCook=(FilePath="/Game/Scene_Warehouse/Maps/Industrial_Warehouse")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Textures")
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/QuantumCharacter")
+DirectoriesToAlwaysCook=(Path="/Game/Survival_Character")
+DirectoriesToAlwaysCook=(Path="/Game/AnimStarterPack")
+DirectoriesToAlwaysCook=(Path="/Game/RifleAnims")
+DirectoriesToAlwaysCook=(Path="/Game/Free_Sounds_Pack")
; /Game/FX never existed and /Game/NiagaraExamples is a 5.7-saved pack (pkg ver 1018 > 5.6's 1017)
; that can NEVER cook in 5.6 (1386 "Version is too old" warnings per cook) — pack parked in
; _parked_content/. The C++ mesh-fallback VFX in PFCombatVFX/PFSplatSubsystem is the shipping system.
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Warehouse")
; Bandit pack = the DEFAULT character body + AK/AKSU/pistol meshes, all soft-loaded by path in C++ (so they
; are NOT auto-discovered by the cooker via hard refs — they MUST be force-cooked here or the package ships
; bodyless characters + missing weapons). ~12 GB, local-only (untracked); must be present on the build machine.
; For a Mac build, sync Content/Bandits/ to the Mac first. See docs/packaging.md.
+DirectoriesToAlwaysCook=(Path="/Game/Bandits")
; Modern Weapons pack (Rifles/SMGs/Pistols) = the 37-row weapon catalog's meshes, soft-loaded by PATH in
; PFWeaponCatalog.cpp (StaticLoadObject), so — exactly like Bandits above — the cooker does NOT discover them
; via hard refs. Without this line the package ships every catalog gun as missing (and the class preview poses
; the character around an invisible rifle). Tracked via LFS (see .gitignore). Added 2026-07-17.
+DirectoriesToAlwaysCook=(Path="/Game/MarketplaceBlockout")
; Phase music MP3s (Suno) — not UAssets; stage as loose files next to Content for MediaPlayer.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Audio")

; For a distributable build, flip BuildConfiguration=PPBC_Shipping + ForDistribution=True above and pass
; -clientconfig=Shipping to the package script. Development is correct for LAN playtests (has the console +
; pf.* debug commands). See docs/packaging.md.
