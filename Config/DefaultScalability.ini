; CombatForge scalability overrides — make LOW/MEDIUM genuinely run on budget GPUs (GTX 1060/1650 class).
;
; IMPORTANT: Scalability.ini can only set ECVF_Scalability-flagged cvars (the engine ENSUREs and ignores
; anything else). The pipeline METHOD switches (Lumen on/off, VSM vs CSM, TSR vs TAA/FXAA — r.*Method,
; r.Shadow.Virtual.Enable, r.SSGI.Enable) are NOT scalability-flagged, so they live in C++:
; FPFUserPrefs::ApplyQualityMethodCVars(), called at boot and on every quality Apply. This file only tunes
; the scalability-flagged knobs per level. Sections MERGE with Engine/Config/BaseScalability.ini.

[GlobalIlluminationQuality@1]
; Medium runs screen-space GI (method set in C++) — give it a decent sample count.
r.SSGI.Quality=2

[ReflectionQuality@1]
; Medium runs SSR (method set in C++).
r.SSR.Quality=2

[ShadowQuality@0]
; Low runs classic CSM (VSM disabled in C++) — keep the maps small.
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=2

[ShadowQuality@1]
r.Shadow.MaxCSMResolution=2048
r.Shadow.CSM.MaxCascades=3

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.BloomQuality=2
r.DepthOfFieldQuality=0
r.LensFlareQuality=0

[PostProcessQuality@1]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
