; CombatForge scalability overrides — make LOW/MEDIUM genuinely run on budget GPUs (GTX 1060/1650 class).
; Stock UE scalability only scales the ACTIVE rendering methods' internals; it never swaps Lumen / Virtual
; Shadow Maps / TSR off. These sections do exactly that at quality 0/1. HIGH (2, the default) and EPIC (3)
; have NO overrides on purpose — they keep the full pipeline the game's look was tuned on.
; Sections MERGE with Engine/Config/BaseScalability.ini (same-named keys override, others remain).

[GlobalIlluminationQuality@0]
; No GI at all — the warehouse reads fine on skylight + emissive fixtures.
r.DynamicGlobalIlluminationMethod=0
r.SSGI.Enable=0

[GlobalIlluminationQuality@1]
; Screen-space GI: ~0.5-1.5ms of cheap indoor bounce instead of Lumen's 2-8ms.
r.DynamicGlobalIlluminationMethod=2
r.SSGI.Quality=2

[ReflectionQuality@0]
r.ReflectionMethod=0

[ReflectionQuality@1]
; Screen-space reflections instead of Lumen reflections.
r.ReflectionMethod=2
r.SSR.Quality=2

[ShadowQuality@0]
; Classic cascaded shadow maps — VSM pages non-Nanite geometry inefficiently and eats VRAM.
r.Shadow.Virtual.Enable=0
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=2

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0
r.Shadow.MaxCSMResolution=2048
r.Shadow.CSM.MaxCascades=3

[AntiAliasingQuality@0]
; FXAA — TSR's compute shaders run poorly on Pascal-class cards.
r.AntiAliasingMethod=1

[AntiAliasingQuality@1]
r.AntiAliasingMethod=2

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.BloomQuality=2
r.DepthOfFieldQuality=0
r.LensFlareQuality=0

[PostProcessQuality@1]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
