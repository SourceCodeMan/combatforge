; ---------------------------------------------------------------------------
; Rename safety net: PaintForge -> CombatForge (2026-07-14). Any asset or save that serialized a reference
; against the old module/classes resolves to the new names. Class redirects cover the renamed UCLASSes;
; the package redirect covers everything else (PF* classes kept their names inside the renamed module).

[CoreRedirects]
+PackageRedirects=(OldName="/Script/PaintForge",NewName="/Script/CombatForge")
+ClassRedirects=(OldName="/Script/PaintForge.PaintForgeCharacter",NewName="/Script/CombatForge.CombatForgeCharacter")
+ClassRedirects=(OldName="/Script/PaintForge.PaintForgeGameMode",NewName="/Script/CombatForge.CombatForgeGameMode")
+ClassRedirects=(OldName="/Script/PaintForge.PaintForgeGameState",NewName="/Script/CombatForge.CombatForgeGameState")
+ClassRedirects=(OldName="/Script/PaintForge.PaintForgePlayerState",NewName="/Script/CombatForge.CombatForgePlayerState")
+ClassRedirects=(OldName="/Script/PaintForge.PaintForgePlayerController",NewName="/Script/CombatForge.CombatForgePlayerController")
+ClassRedirects=(OldName="/Script/PaintForge.PaintForgeGameInstance",NewName="/Script/CombatForge.CombatForgeGameInstance")

