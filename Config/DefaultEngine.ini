; ---------------------------------------------------------------------------
; Navigation — runtime navmesh for the per-match player-built arena (AI pathfinding).
; The arena geometry doesn't exist until players build it, so the mesh is generated at
; RUNTIME and rebuilt as pieces are placed. L_Graybox DOES carry one script-added
; NavMeshBoundsVolume (Scripts/add_nav_bounds.py — the deterministic nav-data trigger;
; added because pure-invoker-without-bounds varies by engine build); invokers still limit
; which tiles actually build. bAutoCreateNavigationData spawns the RecastNavMesh, and every
; character carries a UNavigationInvokerComponent so tiles build around the pawns.
; UE5 module is NavigationSystem (NOT the UE4 [/Script/Engine.*] path).

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
; Only voxelize around registered nav invokers (the pawns) — cheap for a big open arena. Runtime rebuild
; of dirtied tiles is driven by RuntimeGeneration=Dynamic on the RecastNavMesh below.
bGenerateNavigationOnlyAroundNavigationInvokers=True
; One agent sized to ACombatForgeCharacter's default capsule (radius 34, half-height 88 -> full 176).
; ClearArray drops the engine "Default" agent so ours is the only nav data built.
!SupportedAgents=ClearArray
; DefaultQueryExtent generous (150,150,300) so projecting a goal/spawn point onto the mesh tolerates points
; that land a bit off the surface (bots project tactical goals that often sit just off an edge/wall).
+SupportedAgents=(Name="PFPawn",Color=(B=0,G=200,R=0,A=255),DefaultQueryExtent=(X=150.000000,Y=150.000000,Z=300.000000),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=35.000000,AgentHeight=176.000000,AgentStepHeight=45.000000,NavWalkingSearchHeightScale=0.500000,PreferredNavData=None)

[/Script/NavigationSystem.RecastNavMesh]
; Dynamic = voxelize NEW runtime geometry (the built fort). Static never rebuilds; DynamicModifiersOnly
; only re-applies area modifiers, NOT new surfaces — neither works for a fort that appears at runtime.
RuntimeGeneration=Dynamic
AgentRadius=35.000000
AgentHeight=176.000000
AgentMaxStepHeight=45.000000
AgentMaxSlope=44.000000
CellSize=19.000000
TileSizeUU=1000.000000

[/Script/Engine.Engine]
; ADS pulls the weapon's rear inside the default 10cm near plane (receiver would get sliced open at screen
; center). 4cm keeps the whole viewmodel rendered; negligible depth-precision cost at our scene scale.
NearClipPlane=4.0

[/Script/Engine.RendererSettings]
; Graybox readability; everything else default (02 §4.3)
r.DefaultFeature.MotionBlur=False
; Virtual Texturing — required for the Megascans warehouse scene's meshes+materials to render.
; Takes effect on editor launch; first launch does a one-time VT texture build.
r.VirtualTextures=True

[SystemSettings]
; Texture streaming pool: the default (~1000 MB) overflows with the 12 GB Bandit character pack + the
; Megascans warehouse + the character-preview render target, which streams in low-res (washed out) and hitches.
; Bump it well clear of the overage — the target hardware has plenty of VRAM.
r.Streaming.PoolSize=3000
; Image sharpness (Tom 2026-07-18: "less blurry — used to be crisp before the AAA pass"). The default AA is
; TSR (quality High), which ships with ZERO sharpening -> inherent temporal softness. These cvars are NOT
; scalability-flagged, so they only take effect from [SystemSettings] here (ignored in DefaultScalability.ini).
; Near-zero GPU cost; keeps TSR's stability while restoring edge crispness.
r.TSR.Sharpen=0.6
r.Tonemapper.Sharpen=0.4
; On-screen debug messages OFF by default (dev spam, pose dumps, nav checks). Toggle in console with
; EnableAllScreenMessages / DisableAllScreenMessages. Also forced off in GameInstance::Init.
DisableAllScreenMessages=1

