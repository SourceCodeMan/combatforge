+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="BuildTrace")

[/Script/Engine.RendererSettings]
; Graybox readability; everything else default (02 §4.3)
r.DefaultFeature.MotionBlur=False
; Virtual Texturing — required for the Megascans warehouse scene's meshes+materials to render.
; Takes effect on editor launch; first launch does a one-time VT texture build.
r.VirtualTextures=True

[SystemSettings]
; Texture streaming pool: the default (~1000 MB) overflows with the 12 GB Bandit character pack + the
; Megascans warehouse + the character-preview render target, which streams in low-res (washed out) and hitches.
; Bump it well clear of the overage — the target hardware has plenty of VRAM.
r.Streaming.PoolSize=3000

