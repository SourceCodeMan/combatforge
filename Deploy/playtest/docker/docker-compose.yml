# Linux dedicated server for PaintForge (requires Linux server cook in ./server-linux).
# Windows host LAN playtest: use ../run-server.ps1 instead — Win64 exe won't run here.
#
#   docker compose -f Deploy/playtest/docker/docker-compose.yml up --build

services:
  paintforge-ds:
    build: .
    container_name: paintforge-ds
    ports:
      - "7777:7777/udp"
      - "7777:7777/tcp"
    environment:
      PF_MAP: /Game/Maps/L_Graybox
      PF_PORT: "7777"
    restart: unless-stopped
    # Uncomment if you want host networking on Linux Docker (not supported the same on Docker Desktop Mac/Win):
    # network_mode: host
