# Linux dedicated server for CombatForge (requires Linux server cook in ./server-linux).
# Windows host LAN playtest: use ../run-server.ps1 instead — Win64 exe won't run here.
#
#   docker compose -f Deploy/playtest/docker/docker-compose.yml up --build

services:
  combatforge-ds:
    build: .
    container_name: combatforge-ds
    ports:
      - "7777:7777/udp"
      - "7777:7777/tcp"
    environment:
      PF_MAP: /Game/Maps/L_Graybox
      PF_PORT: "7777"
    restart: unless-stopped
    volumes:
      # PFPaths.cpp resolves arena records to /var/lib/combatforge/Arenas on a Linux dedicated
      # server (-server / -nullrhi / -NOHOMEDIR all set here). Without this volume that lives only
      # in the container's writable layer, so every `down`, `up --build`, or image update silently
      # destroys every community-built arena and its preview .png. `restart: unless-stopped` hides
      # it in normal operation — the data survives restarts and only dies when you rebuild. (#26)
      - combatforge-data:/var/lib/combatforge
    # Uncomment if you want host networking on Linux Docker (not supported the same on Docker Desktop Mac/Win):
    # network_mode: host

volumes:
  combatforge-data:
